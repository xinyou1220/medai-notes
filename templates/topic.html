<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}｜醫療人工智慧概念講義</title>
  <meta name="description" content="{{SUMMARY}}">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../data/site.js" defer></script>
  <script src="../data/topics.js" defer></script>
  <script src="../data/glossary.js" defer></script>
  <script src="../assets/js/site.js" defer></script>
</head>
<body data-page="topic" data-root=".." data-slug="{{SLUG}}">
  <header id="site-header"></header>

  <main class="container article-layout">
    <article class="topic">
      <nav class="breadcrumb" id="breadcrumb" aria-label="導覽路徑"></nav>
      <h1>{{TITLE}}</h1>
      <p class="title-en">{{TITLE_EN}}</p>
      <div class="topic-meta" id="topic-meta"></div>

      <section id="summary" class="summary">
        <h2>摘要</h2>
        <!-- 撰寫說明：1～2 句、60～120 字，說明「這是什麼」與「在醫療上用來做什麼」。 -->
        <p>{{待填寫：摘要}}</p>
      </section>

      <section id="background">
        <h2>背景與動機</h2>
        <!-- 撰寫說明：1～2 段，說明醫療現場為何需要這項技術、要解決什麼問題。 -->
        <p>{{待填寫：背景與動機}}</p>
      </section>

      <section id="principle">
        <h2>核心原理</h2>
        <!-- 撰寫說明：2～4 段，說明運作方式；可使用條列或 div.table-wrap 包覆的表格；避免數學式。 -->
        <p>{{待填寫：核心原理}}</p>
      </section>

      <section id="applications">
        <h2>臨床應用案例</h2>
        <!-- 撰寫說明：2～4 個案例，每個案例以 h3 開頭，寫出研究或產品名稱、年份與主要結果，並列入參考資料。 -->
        <h3>{{待填寫：案例名稱}}</h3>
        <p>{{待填寫：案例說明}}</p>
      </section>

      <section id="limitations">
        <h2>限制與風險</h2>
        <!-- 撰寫說明：3～5 點條列，每點以 strong 標示關鍵詞，再以一至兩句說明。 -->
        <ul>
          <li><strong>{{待填寫：關鍵詞}}</strong>：{{待填寫：說明}}</li>
        </ul>
      </section>

      <section id="key-points">
        <h2>重點整理</h2>
        <!-- 撰寫說明：3～5 點，每點一句，讀者只看這一節也能掌握主題重點。 -->
        <ul>
          <li>{{待填寫：重點}}</li>
        </ul>
      </section>

      <section id="references">
        <h2>參考資料</h2>
        <!-- 撰寫說明：2～8 筆，格式見 AGENTS.md；每筆須附 DOI、arXiv 或官方網址連結；不得列出無法查證的文獻。 -->
        <ol>
          <li>{{待填寫：作者. 標題. 期刊. 年份;卷(期):頁碼.}} <a href="https://doi.org/">{{待填寫：連結}}</a></li>
        </ol>
      </section>

      <section class="related" id="related" aria-label="相關主題"></section>
      <nav class="pager" id="pager" aria-label="上一篇與下一篇"></nav>
    </article>

    <aside class="toc" id="toc" aria-label="本頁目次"></aside>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
